services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
        NEXT_PUBLIC_PLATFORM_ADMIN_DOMAINS: ${NEXT_PUBLIC_PLATFORM_ADMIN_DOMAINS:-cypherops.com.br}
        NEXT_PUBLIC_PLATFORM_ADMIN_EMAILS: ${NEXT_PUBLIC_PLATFORM_ADMIN_EMAILS:-}
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
